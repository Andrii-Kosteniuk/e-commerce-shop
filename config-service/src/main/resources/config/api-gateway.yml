server:
  port: 9091
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: auth-service
            uri: lb://auth-service
            predicates:
              - Path=/api/v1/auth/**

          - id: product-service
            uri: lb://product-service
            predicates:
              - Path=/api/v1/products/**, /api/v1/admin/products/**

          - id: order-service
            uri: lb://order-service
            predicates:
              - Path=/api/v1/orders/**, /api/v1/admin/orders/**

          - id: payment-service
            uri: lb://payment-service
            predicates:
              - Path=/api/v1/payments/**
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${REDIS_PASSWORD}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: api-gateway
    instance-id: ${spring.application.name}:${server.port}
    home-page-url: http://api-gateway:${server.port}/


security:
  internal-api-key: ${SECURITY_INTERNAL_API_KEY}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 50

  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: true

gateway:
  path:
    public: /api/v1/auth/
    internal: /api/v1/internal/