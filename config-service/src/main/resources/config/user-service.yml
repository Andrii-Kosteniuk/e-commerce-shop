server:
  port: 8082

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://user-postgres:5432/user_service_db
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true
        format_sql: true
  data:
    redis:
      port: 6379
      host: ${REDIS_HOST:redis}
      password: ${REDIS_PASSWORD}
  cache:
    type: redis

security:
  internal-api-key: ${SECURITY_INTERNAL_API_KEY}
  token-blocklist:
    prefix: blocklist